<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071629">
  <title>Adscope Employee Portal</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071629;color:#fff;font:16px Arial,sans-serif}.boot{max-width:520px;padding:28px;text-align:center}.boot strong{display:block;font-size:22px;margin-bottom:8px}.boot p{color:#b9c7d8;line-height:1.5}.boot button{margin-top:14px;padding:11px 18px;border:0;border-radius:10px;background:#c9a557;color:#071629;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="boot"><strong>Loading Adscope HRMS…</strong><p>Securely preparing your workspace.</p></div>
  <script>
    (() => {
      const bundleUrl = 'https://fazvuuwgahuxacvgyslf.supabase.co/functions/v1/hrms-static-assets?bundle=attendance';
      const timeoutMs = 15000;

      function loadingView() {
        document.body.innerHTML = '<div class="boot"><strong>Loading Adscope HRMS…</strong><p>Securely preparing your workspace.</p></div>';
      }

      function errorView() {
        document.body.innerHTML = '<div class="boot" role="alert"><strong>Unable to open the portal</strong><p>We could not prepare your secure workspace. Check your connection and try again.</p><button id="retryPortal" type="button">Retry</button></div>';
        document.getElementById('retryPortal').addEventListener('click', loadPortal);
      }

      function employeeTimeFormatPatch() {
        const source=`(function(){
'use strict';
if(window.__ADSCOPE_EMPLOYEE_TIME_FORMAT__)return;
window.__ADSCOPE_EMPLOYEE_TIME_FORMAT__=true;
var cfg=window.ADSCOPE_CONFIG;
if(!cfg||!window.supabase)return;
var client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
var state={timeFormat:'12',loaded:false};
var timer=null;
function clock(hour,minute,second,meridiem){var h=Number(hour);if(meridiem){var marker=String(meridiem).toUpperCase();if(marker==='PM'&&h<12)h+=12;if(marker==='AM'&&h===12)h=0;}var suffix=second===undefined?'':':'+second;if(state.timeFormat==='24')return String(h).padStart(2,'0')+':'+minute+suffix;var display=h%12||12;return String(display)+':'+minute+suffix+' '+(h>=12?'PM':'AM');}
function formatText(value){var text=String(value||'');if(text.indexOf(':')<0)return text;var output=text.replace(/(^|[^A-Za-z0-9])((?:0?[1-9]|1[0-2])):([0-5]\\d)(?::([0-5]\\d))?\\s*(AM|PM)\\b/gi,function(_,prefix,hour,minute,second,meridiem){return prefix+clock(hour,minute,second,meridiem);});return output.replace(/(^|[^A-Za-z0-9])([01]?\\d|2[0-3]):([0-5]\\d)(?::([0-5]\\d))?(?!\\s*(?:AM|PM)\\b)/g,function(_,prefix,hour,minute,second){return prefix+clock(hour,minute,second);});}
function skipNode(node){var parent=node&&node.parentElement;return !parent||Boolean(parent.closest('script,style,textarea,input,select,option'));}
function formatPortal(){if(!state.loaded)return;var root=document.getElementById('portalApp')||document.body;var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(function(node){if(skipNode(node))return;var formatted=formatText(node.nodeValue);if(formatted!==node.nodeValue)node.nodeValue=formatted;});}
async function loadFormat(){state.loaded=false;var sessionResult=await client.auth.getSession();var session=sessionResult.data&&sessionResult.data.session;if(!session)return;var membershipResult=await client.from('organization_memberships').select('organization_id').eq('user_id',session.user.id).eq('is_active',true).limit(1).maybeSingle();if(membershipResult.error)throw membershipResult.error;if(!membershipResult.data)return;var organizationResult=await client.from('organizations').select('time_format').eq('id',membershipResult.data.organization_id).single();if(organizationResult.error)throw organizationResult.error;state.timeFormat=organizationResult.data.time_format==='24'?'24':'12';state.loaded=true;formatPortal();}
var observer=new MutationObserver(function(){window.clearTimeout(timer);timer=window.setTimeout(formatPortal,25);});observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});client.auth.onAuthStateChange(function(){window.setTimeout(function(){loadFormat().catch(function(){});},0);});loadFormat().catch(function(){});window.setTimeout(formatPortal,0);
})();`;
        return '<scr'+'ipt data-adscope-employee-time-format="time-format-v1">'+source+'</scr'+'ipt>';
      }

      async function loadPortal() {
        loadingView();
        const controller = new AbortController();
        let timer;
        try {
          const deadline = new Promise((_, reject) => {
            timer = window.setTimeout(() => {
              controller.abort();
              reject(new Error('Portal initialization timed out'));
            }, timeoutMs);
          });
          const request = (async () => {
            if (!('DecompressionStream' in window)) throw new Error('Unsupported browser');
            const response = await fetch(bundleUrl, { cache:'no-store', signal:controller.signal });
            if (!response.ok) throw new Error('Portal bundle unavailable');
            const encoded = await response.text();
            const binary = atob(encoded);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
            return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
          })();
          const html = await Promise.race([request, deadline]);
          const shouldInjectTimeFormat=/id\s*=\s*["']portalApp["']/i.test(html);
          const timeFormatPatch=shouldInjectTimeFormat?employeeTimeFormatPatch():'';
          const patchedHtml=!timeFormatPatch?html:(/<\/body>/i.test(html)?html.replace(/<\/body>/i,timeFormatPatch+'</body>'):html+timeFormatPatch);
          window.clearTimeout(timer);
          document.open();
          document.write(patchedHtml);
          document.close();
        } catch (_) {
          window.clearTimeout(timer);
          errorView();
        }
      }

      loadPortal();
    })();
  </script>
</body>
</html>
