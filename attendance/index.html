<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071629">
  <title>Adscope Employee Portal</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071629;color:#fff;font:16px Arial,sans-serif}.boot{max-width:520px;padding:28px;text-align:center}.boot strong{display:block;font-size:22px;margin-bottom:8px}.boot p{color:#b9c7d8;line-height:1.5}.boot button{margin-top:14px;padding:11px 18px;border:0;border-radius:10px;background:#c9a557;color:#071629;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="boot"><strong>Loading Adscope HRMS…</strong><p>Securely preparing your workspace.</p></div>
  <script>
    (() => {
      const bundleUrl = 'https://fazvuuwgahuxacvgyslf.supabase.co/functions/v1/hrms-static-assets?bundle=attendance';
      const timeoutMs = 15000;

      function loadingView() {
        document.body.innerHTML = '<div class="boot"><strong>Loading Adscope HRMS…</strong><p>Securely preparing your workspace.</p></div>';
      }

      function errorView() {
        document.body.innerHTML = '<div class="boot" role="alert"><strong>Unable to open the portal</strong><p>We could not prepare your secure workspace. Check your connection and try again.</p><button id="retryPortal" type="button">Retry</button></div>';
        document.getElementById('retryPortal').addEventListener('click', loadPortal);
      }

      function patchAttendanceBundle(html) {
        const oldEventsQuery = "const q=await client.from('attendance_events').select('event_type,occurred_at').eq('employee_id',employeeId).eq('attendance_date',localDate()).order('occurred_at');if(q.error)throw q.error;events=q.data||[];";
        const newEventsQuery = "const today=localDate();const dateValue=new Date(today+'T00:00:00Z');dateValue.setUTCDate(dateValue.getUTCDate()-1);const previous=dateValue.toISOString().slice(0,10);const q=await client.from('attendance_events').select('event_type,occurred_at,attendance_date').eq('employee_id',employeeId).gte('attendance_date',previous).lte('attendance_date',today).order('occurred_at');if(q.error)throw q.error;const allEvents=q.data||[];const dates=[...new Set(allEvents.map(e=>e.attendance_date))].sort().reverse();const activeDate=dates.find(date=>{const dayEvents=allEvents.filter(e=>e.attendance_date===date);return dayEvents.some(e=>e.event_type==='CHECK_IN')&&!dayEvents.some(e=>e.event_type==='CHECK_OUT')});profile.attendance_date=activeDate||today;events=allEvents.filter(e=>e.attendance_date===profile.attendance_date);";
        let patched = html.replace(oldEventsQuery, newEventsQuery);
        patched = patched.replace("break:['BREAK_END']", "break:['BREAK_END','CHECK_OUT']");
        patched = patched.replace('<span>Date</span><strong>${esc(localDate())}</strong>', '<span>Shift date</span><strong>${esc(profile.attendance_date||localDate())}</strong>');
        patched = patched.replace('<div class="events"><strong>Today’s events</strong>', '<div class="events"><strong>Current shift events</strong>');
        patched = patched.replace("toast(`${label(type)} recorded.`);await load();render()", "const warnings=[data?.review_warning,data?.late_warning].filter(Boolean);toast(warnings.join(' ')||`${label(type)} recorded.`);await load();render()");
        return patched;
      }

      async function loadPortal() {
        loadingView();
        const controller = new AbortController();
        let timer;
        try {
          const deadline = new Promise((_, reject) => {
            timer = window.setTimeout(() => {
              controller.abort();
              reject(new Error('Portal initialization timed out'));
            }, timeoutMs);
          });
          const request = (async () => {
            if (!('DecompressionStream' in window)) throw new Error('Unsupported browser');
            const response = await fetch(bundleUrl, { cache:'no-store', signal:controller.signal });
            if (!response.ok) throw new Error('Portal bundle unavailable');
            const encoded = await response.text();
            const binary = atob(encoded);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
            const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
            return patchAttendanceBundle(html);
          })();
          const html = await Promise.race([request, deadline]);
          window.clearTimeout(timer);
          document.open();
          document.write(html);
          document.close();
        } catch (_) {
          window.clearTimeout(timer);
          errorView();
        }
      }

      loadPortal();
    })();
  </script>
</body>
</html>
