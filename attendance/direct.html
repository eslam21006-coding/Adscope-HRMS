<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071629">
  <title>Adscope Employee Portal</title>
  <style>
    :root{color-scheme:dark;--bg:#071629;--panel:#0d2038;--panel2:#10253f;--line:#263d58;--text:#f8fbff;--muted:#a9b8c9;--gold:#d1ad57;--danger:#e36b70;--ok:#68c68a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px #0007}.login-card h1{margin:0 0 8px;font-size:28px}.login-card p,.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field span{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #36506e;border-radius:11px;background:#081a2e;color:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}button,.button{border:1px solid #405774;border-radius:11px;background:#142a44;color:#fff;padding:11px 15px;font-weight:800}.primary{background:var(--gold);border-color:var(--gold);color:#071629}.secondary{background:#17324f}.ghost{background:transparent}.full{width:100%}.shell,.portal-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar,aside{background:#081a2e;border-right:1px solid var(--line);padding:22px 15px}.brand{font-size:20px;font-weight:900;margin:0 10px 24px}.nav,.sidebar nav{display:grid;gap:6px}.nav button,.sidebar nav button,[data-page]{text-align:left;background:transparent;border:0;color:#b9c8d9;padding:11px 13px;border-radius:10px}.nav button.active,.sidebar nav button.active,[data-page].active{background:#153553;color:#fff}.main,main{min-width:0;padding:24px 30px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.topbar h1{margin:0}.panel,.card,.attendance-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 40px #0003;margin-bottom:18px}.panel-head,.card-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-body,.card-body{padding:20px 22px}.attendance-card{padding:24px}.attendance-card h2,.attendance-card h3{margin-top:0}.stat-grid,.summary-grid,.attendance-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.stat,.meta-item,.attendance-meta>div{background:#0a1d33;border:1px solid #29435e;border-radius:13px;padding:14px}.stat span,.meta-item span,.attendance-meta span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.stat strong,.meta-item strong,.attendance-meta strong{font-size:17px}.button-row,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.attendance-actions button{min-height:52px;flex:1}.event-list,.events{margin-top:20px}.event,.events>div{padding:10px 0;border-bottom:1px solid #223b56}.notice{padding:13px 15px;border:1px solid #415872;border-radius:12px;background:#102740;margin:12px 0}.notice.warning{border-color:#8c7135;background:#2a2518}.notice.error{border-color:#87454b;background:#2b171b}.notice.success{border-color:#36724e;background:#11291e}.danger{color:var(--danger)}.success{color:var(--ok)}.toast-root,#toastRoot{position:fixed;right:18px;bottom:18px;z-index:9999;display:grid;gap:8px;max-width:min(440px,calc(100vw - 36px))}.toast{background:#172f4b;border:1px solid #45617f;border-radius:12px;padding:13px 15px;box-shadow:0 12px 35px #0008}.toast.error{background:#5b2227;border-color:#8b464b}.toast.success{background:#173c29;border-color:#397153}.table-wrap{overflow:auto}.data-table,table{width:100%;border-collapse:collapse}.data-table th,.data-table td,th,td{padding:11px 10px;border-bottom:1px solid #263d58;text-align:left;white-space:nowrap}.data-table th,th{color:#b9c8d9;font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px}.spinner{width:24px;height:24px;border:3px solid #42566f;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:800px){.shell,.portal-shell{grid-template-columns:1fr}.sidebar,aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}.sidebar nav,.nav{display:flex;overflow:auto}.main,main{padding:18px 14px}.stat-grid,.summary-grid,.attendance-meta{grid-template-columns:1fr}.topbar{align-items:flex-start}.attendance-card{padding:18px}.button-row,.actions{flex-direction:column}.button-row button,.actions button{width:100%}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body>
  <div id="portalApp"><section class="login-page"><div class="login-card"><div class="spinner"></div><p style="text-align:center">Preparing your secure workspace…</p></div></section></div>
  <div id="toastRoot" class="toast-root"></div>
  <script src="/attendance/portal.js"></script>
</body>
</html>
