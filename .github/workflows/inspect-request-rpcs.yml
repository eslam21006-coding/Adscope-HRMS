name: Inspect request RPC contract

on:
  push:
    branches:
      - fix/request-submit-contract
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe live request RPC parameter names
        run: node scripts/inspect-request-rpcs.mjs
      - name: Inspect checked-in request workflow references
        shell: bash
        run: |
          grep -Rni -C 30 -E 'submit_permission_request|submit_leave_request|submit_advance_request|submit_violation_response|late_start|early_leave|permission_requests|grant execute.*submit_|revoke.*submit_' supabase/migrations attendance admin | head -n 2500 || true
